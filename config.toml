baseURL = "https://radicool-dev.github.io/"
locale = "en-US"
title = "Home"
theme = "loficode"

# Enable emoji support
enableEmoji = true

# Output formats for SPA functionality
[outputs]
  home = ["HTML", "JSON", "pages"]
  page = ["HTML"]
  section = ["HTML"]

# Custom output formats
[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true
  [outputFormats.pages]
    mediaType = "application/json"
    baseName = "pages"
    isPlainText = true

# Pagination
[pagination]
  pagerSize = 6
  path = "page"

[params]
  description = "My Cybersecurity Website"
  tagline = "Offensive Cybersecurity Engineer"

  # Profile section
  [params.author]
    name = "Radicool"
    image = "images/new_profile.png"

  # Social links - Supported platforms: github, twitter, linkedin, email, mastodon, youtube, instagram, facebook, rootme
  [params.social]
    github = "https://github.com/Radicool-dev"
    # twitter = "https://twitter.com/example"
    linkedin = "https://linkedin.com/in/benjamin-thomas-212111193"
    email = "ben.thomas.pro@gmail.com"
    rootme = "https://www.root-me.org/radicool?inc=info&lang=fr"
    # mastodon = "https://mastodon.social/@example"
    # youtube = "https://youtube.com/@example"
    # instagram = "https://instagram.com/example"
    # facebook = "https://facebook.com/example"

# Main navigation menu
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 10

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 20

# Markup configuration for syntax highlighting
[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = true
    lineNumbersInTable = false
    tabWidth = 2
    noClasses = false

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"
