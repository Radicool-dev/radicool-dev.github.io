<header class="site-header">
    <nav>
        <div class="nav-left">
            <a href="{{ "/" | absLangURL }}" class="logo">{{ .Site.Title }}</a>
        </div>

        <div class="nav-links">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | absLangURL }}" class="nav-link">{{ .Name }}</a>
            {{ end }}
        </div>

        <div class="header-controls">
            <button class="search-toggle" title="Search posts" aria-label="Search posts">🔍</button>
            <button class="menu-toggle" id="menuToggle" title="Menu" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
                <span class="menu-toggle-bar"></span>
                <span class="menu-toggle-bar"></span>
                <span class="menu-toggle-bar"></span>
            </button>
        </div>
    </nav>

    <!-- Sliding Search Form -->
    <div class="search-form-container" id="searchForm">
        <div class="search-form">
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" placeholder="Search posts..." autocomplete="off" aria-label="Search posts">
                <button class="search-submit" type="button" aria-label="Submit search">
                    <span>🔍</span>
                </button>
                <button class="search-close" type="button" aria-label="Close search">
                    <span>✕</span>
                </button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <!-- Menu mobile deroulant -->
    <div class="mobile-menu" id="mobileMenu">
        {{ range .Site.Menus.main }}
        <a href="{{ .URL | absLangURL }}" class="mobile-menu-link">{{ .Name }}</a>
        {{ end }}
    </div>
</header>
